{% extends "base.html" %}
{% block title %}Reset Password - JobTrack{% endblock %}
{% block auth_content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo"><div class="brand-icon"><i class="bi bi-key"></i></div></div>
        <h1>Reset password</h1>
        <p class="auth-subtitle">Enter the OTP sent to <strong>{{ email }}</strong>.</p>

        {% if error %}<div class="error-message">{{ error }}</div>{% endif %}

        <form method="POST">
            <div class="form-group">
                <label>6-digit OTP</label>
                <input type="text" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                       required placeholder="Enter OTP" autocomplete="one-time-code">
            </div>
            <div class="form-group">
                <label>New password</label>
                <input type="password" name="new_password" minlength="6" required placeholder="At least 6 characters">
            </div>
            <div class="form-group">
                <label>Confirm new password</label>
                <input type="password" name="confirm_password" minlength="6" required placeholder="Repeat password">
            </div>
            <button class="btn-primary w-100" type="submit">Reset Password</button>
        </form>

        <p class="auth-footer">
            Didn't receive the OTP? <a href="{{ url_for('forgot_password') }}">Send again</a>
        </p>
    </div>
</div>
{% endblock %}
