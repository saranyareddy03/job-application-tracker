{% extends "base.html" %}{% block title %}Register - JobTrack{% endblock %}{% block auth_content %}
<div class="auth-container"><div class="auth-card"><div class="auth-logo"><div class="brand-icon"><i class="bi bi-briefcase-fill"></i></div></div><h1>Create account</h1><p class="auth-subtitle">Start organizing your job search.</p>
{% if error %}<div class="error-message">{{ error }}</div>{% endif %}
<form method="POST"><div class="form-group"><label>Full name</label><input type="text" name="name" required placeholder="Your name"></div><div class="form-group"><label>Email</label><input type="email" name="email" required placeholder="you@example.com"></div><div class="form-group"><label>Password</label><input type="password" name="password" required placeholder="At least 6 characters"></div><div class="form-group"><label>Confirm password</label><input type="password" name="confirm_password" required placeholder="Repeat password"></div><button class="btn-primary w-100" type="submit">Create account</button></form><p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Login</a></p></div></div>
{% endblock %}
